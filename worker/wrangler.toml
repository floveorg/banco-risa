name = "liberada-subdomains"
main = "worker.mjs"
compatibility_date = "2024-01-01"

# Route: SOLO subdominios (*.liberada.net/*). El apex liberada.net NO se intercepta
# (evita el bucle liberada.net→liberada.net que rompía el SSL de Pages).
route = { pattern = "*.liberada.net/*", zone_name = "liberada.net" }
